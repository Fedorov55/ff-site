<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>3D Test</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
<style>
body { background: #0A0D14; color: #fff; margin: 0; padding: 20px; }
model-viewer { width: 100%; height: 600px; background: transparent; }
</style>
</head>
<body>
<h1>3D Model Test</h1>
<model-viewer 
  src="img/server-rack.glb" 
  alt="Test"
  auto-rotate 
  camera-controls
  shadow-intensity="2"
  environment-image="neutral"
  exposure="2"
  camera-orbit="30deg 75deg 120%"
  style="width:100%; height:600px;"
></model-viewer>
</body>
</html>
